#     Django CORS allows cross-origin requests from the frontend domain.
#
# Before deploying:
#   1. DNS A records on purixiabd.com pointing to your server IP:
#        @     -> server IP
#        www   -> server IP
#        admin -> server IP
#   2. Ensure this project directory is pushed to your git repo.
#   3. Deploy this file as a "Docker Compose" service in Dokploy.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: purixia_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DJANGO_SETTINGS_MODULE: core.settings.prod
      # Persist the SQLite DB on a named volume so orders/users survive redeploys
      SQLITE_DB_PATH: /app/sqlite/db.sqlite3
    volumes:
      - sqlite_data:/app/sqlite
    networks:
      - backend-net
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.http.routers.purixia-backend.rule=Host(`admin.purixiabd.com`)
      - traefik.http.routers.purixia-backend.entrypoints=websecure
      - traefik.http.routers.purixia-backend.tls.certResolver=letsencrypt
      - traefik.docker.network=dokploy-network
      - traefik.http.services.purixia-backend.loadbalancer.server.port=8000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
