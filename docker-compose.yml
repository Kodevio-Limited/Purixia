# Purixia BD - single deployment (frontend + backend + postgres + redis) on Dokploy
#
# ONE global compose file deploys everything. TWO public domains:
#
#   FRONTEND  -> https://purixiabd.com  (also www.purixiabd.com)
#   BACKEND   -> https://admin.purixiabd.com
#
# How it works:
#   - frontend/backend join "dokploy-network" so Traefik routes to them.
#   - The backend is publicly reachable at admin.purixiabd.com.
#     Visit admin.purixiabd.com/admin/ for the Django admin panel.
#   - The frontend (storefront) calls the backend
#     DIRECTLY at https://admin.purixiabd.com (no reverse proxy).
#     Django CORS allows cross-origin requests from the frontend domain.
#   - Postgres ("db") and Redis ("redis") are INTERNAL ONLY (no Traefik labels).
#     Data lives on the "postgres_data" named volume and survives redeploys.
#   - Uploaded media lives on the "media_data" named volume and survives
#     redeploys. Images shipped in the image seed the volume on first boot.
#
# ── LOAD BALANCING ───────────────────────────────────────────────────────────
#   Traefik (already running in Dokploy) IS the load balancer. Increasing
#   `deploy.replicas` on the backend/frontend services spins up more containers
#   that Traefik automatically fans requests out across, and the Traefik
#   healthcheck below removes any replica that stops answering /api/health/.
#
#   Scale up/down without editing this file:
#       docker compose up -d --scale backend=3 --scale frontend=2
#   or just change the `replicas:` values and redeploy.
#
#   Because more than one replica now runs, sessions/throttling must not live in
#   per-container memory, so Redis is wired in as the shared cache. Cart sessions
#   already live in Postgres, which is shared too.
#
# Required env vars in Dokploy (compose service -> Environment):
#   SECRET_KEY=<long random string>
#   POSTGRES_PASSWORD=<strong db password>   (single source of DB credentials)
#
# The Django admin is NOT managed from the environment. Create it once inside a
# backend container and manage the password in /admin/ or with changepassword:
#   docker exec -it <backend-container> python manage.py createsuperuser \
#     --settings=core.settings.prod
#
#   These are injected into the containers directly from this environment —
#   there is no committed .env file. backend/.env.example is the local-dev
#   template only.
#
# Optional (defaults shown):
#   POSTGRES_DB=purixia  POSTGRES_USER=purixia
#   ALLOWED_HOSTS=purixiabd.com,www.purixiabd.com,admin.purixiabd.com
#   CORS_ALLOWED_ORIGINS=https://purixiabd.com,https://www.purixiabd.com
#   CSRF_TRUSTED_ORIGINS=https://purixiabd.com,https://www.purixiabd.com,https://admin.purixiabd.com
#   REDIS_URL=redis://redis:6379/0
#   DELIVERY_CHARGE_INSIDE=60  DELIVERY_CHARGE_OUTSIDE=120
#   THROTTLE_ORDER=10/hour     MAX_OPEN_ORDERS=1   (COD abuse protection)
#
# Before deploying:
#   1. DNS A records on purixiabd.com pointing to your server IP:
#        @     -> server IP
#        www   -> server IP
#        admin -> server IP
#   2. Ensure this project directory is pushed to your git repo.
#   3. Deploy this file as a "Docker Compose" service in Dokploy.
#   4. NEVER delete the postgres_data / media_data volumes unless you
#      intend to wipe all users, orders and uploads.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-purixia}
      POSTGRES_USER: ${POSTGRES_USER:-purixia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Dokploy environment}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Shared cache for rate limiting / sessions across backend replicas.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot schema migration. Runs to completion BEFORE any backend replica
  # starts, so replicas never race each other on migrations.
  #
  # The admin account is deliberately NOT managed from the environment: there is
  # no ADMIN_* env and no automatic create/reset. Create it once inside a backend
  # container and manage the password in the Django admin / `changepassword`:
  #   docker exec -it <backend-container> python manage.py createsuperuser \
  #     --settings=core.settings.prod
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: "no"
    # All configuration comes from the orchestrator environment, so a fresh
    # deploy can never boot without its secrets (no committed .env required).
    environment:
      DJANGO_SETTINGS_MODULE: core.settings.prod
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in the Dokploy environment}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-purixiabd.com,www.purixiabd.com,admin.purixiabd.com}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://purixiabd.com,https://www.purixiabd.com}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://purixiabd.com,https://www.purixiabd.com,https://admin.purixiabd.com}
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-purixia}
      DB_USER: ${POSTGRES_USER:-purixia}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Dokploy environment}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    command: >
      sh -c "python manage.py migrate --noinput --settings=core.settings.prod &&
             python manage.py collectstatic --noinput --settings=core.settings.prod"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend-net

  # One-shot fix-up for the shared media volume. The backend runs as the
  # unprivileged "app" user, but a media volume created by an older image (or by
  # a root process) is root-owned, so uploads fail with PermissionError -> 500
  # in the admin. This runs as root, makes the volume writable by "app", and
  # exits before any backend replica starts. Safe to run every deploy.
  media-init:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: "no"
    user: root
    command: >
      sh -c "mkdir -p /app/media/products /app/media/categories /app/media/banners &&
             chown -R app:app /app/media &&
             echo 'media volume owned by app:app'"
    volumes:
      - media_data:/app/media
    networks:
      - backend-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    # Give Gunicorn time for a graceful drain (gunicorn.conf.py graceful_timeout
    # is 30s). Docker's default 10s would SIGKILL mid-request, so a rolling
    # restart WOULD drop in-flight requests without this.
    stop_grace_period: 40s
    # Load-balanced by Traefik across every replica.
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M
    environment:
      DJANGO_SETTINGS_MODULE: core.settings.prod
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in the Dokploy environment}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-purixiabd.com,www.purixiabd.com,admin.purixiabd.com}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://purixiabd.com,https://www.purixiabd.com}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://purixiabd.com,https://www.purixiabd.com,https://admin.purixiabd.com}
      # Postgres connection (internal hostname "db"). Credentials resolve to
      # the POSTGRES_* vars above; DB_PASSWORD maps to the single secret.
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-purixia}
      DB_USER: ${POSTGRES_USER:-purixia}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Dokploy environment}
      # Shared cache/rate-limit backend across replicas.
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # COD abuse protection (defaults shown; see backend/.env.example).
      THROTTLE_ORDER: ${THROTTLE_ORDER:-10/hour}
      MAX_OPEN_ORDERS: ${MAX_OPEN_ORDERS:-1}
      # Explicit concurrency budget (see backend/gunicorn.conf.py):
      #   4 workers x 8 threads = 32 in-flight requests per replica
      #   ~50 MB RSS per worker, and 1 Postgres connection per worker
      #   => ~4 DB connections per replica, 4 x replicas across the fleet.
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-8}
      # Schema and admin bootstrap are owned by the "migrate" service above,
      # not by each replica (two replicas doing it at once would race).
      MIGRATE_ON_BOOT: "0"
      BOOTSTRAP_ON_BOOT: "0"
    depends_on:
      migrate:
        condition: service_completed_successfully
      # Ensure the media volume is app-writable before we can write uploads.
      media-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      # Persist merchant uploads across redeploys (MEDIA_ROOT=/app/media).
      - media_data:/app/media
    networks:
      - backend-net
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.http.routers.purixia-backend.rule=Host(`admin.purixiabd.com`)
      - traefik.http.routers.purixia-backend.entrypoints=websecure
      - traefik.http.routers.purixia-backend.tls.certResolver=letsencrypt

      # HTTP -> HTTPS redirect (unique middleware name per project so it never
      # collides with another stack on the shared Traefik).
      - traefik.http.routers.purixia-backend-http.rule=Host(`admin.purixiabd.com`)
      - traefik.http.routers.purixia-backend-http.entrypoints=web
      - traefik.http.routers.purixia-backend-http.middlewares=purixia-backend-https
      - traefik.http.middlewares.purixia-backend-https.redirectscheme.scheme=https
      - traefik.http.middlewares.purixia-backend-https.redirectscheme.permanent=true
      - traefik.docker.network=dokploy-network
      - traefik.http.services.purixia-backend.loadbalancer.server.port=8000
      # Only route to replicas that answer the health endpoint.
      - traefik.http.services.purixia-backend.loadbalancer.healthcheck.path=/api/health/
      - traefik.http.services.purixia-backend.loadbalancer.healthcheck.interval=15s
      - traefik.http.services.purixia-backend.loadbalancer.healthcheck.timeout=5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://admin.purixiabd.com
    restart: unless-stopped
    # Next.js handles SIGTERM itself; this gives it room to finish responses.
    stop_grace_period: 30s
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - backend-net
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.http.routers.purixia-frontend.rule=Host(`purixiabd.com`) || Host(`www.purixiabd.com`)
      - traefik.http.routers.purixia-frontend.entrypoints=websecure
      - traefik.http.routers.purixia-frontend.tls.certResolver=letsencrypt

      # HTTP -> HTTPS redirect (uniquely named; see backend above).
      - traefik.http.routers.purixia-frontend-http.rule=Host(`purixiabd.com`) || Host(`www.purixiabd.com`)
      - traefik.http.routers.purixia-frontend-http.entrypoints=web
      - traefik.http.routers.purixia-frontend-http.middlewares=purixia-frontend-https
      - traefik.http.middlewares.purixia-frontend-https.redirectscheme.scheme=https
      - traefik.http.middlewares.purixia-frontend-https.redirectscheme.permanent=true
      - traefik.docker.network=dokploy-network
      - traefik.http.services.purixia-frontend.loadbalancer.server.port=3000
      - traefik.http.services.purixia-frontend.loadbalancer.healthcheck.path=/api/health
      - traefik.http.services.purixia-frontend.loadbalancer.healthcheck.interval=15s
      - traefik.http.services.purixia-frontend.loadbalancer.healthcheck.timeout=5s

volumes:
  postgres_data:
  media_data:

networks:
  backend-net:
  dokploy-network:
    external: true
