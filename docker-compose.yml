# Purixia BD - single deployment (frontend + backend) on Dokploy
#
# ONE global compose file deploys both services. TWO public domains/DSNs:
#
#   FRONTEND  -> https://purixia.kodevio.com
#   BACKEND   -> https://purixiabackend.kodevio.com   (<-- change if you want a different subdomain)
#
# How it works:
#   - both services join the "dokploy-network" so Traefik routes to them.
#   - The backend is publicly reachable at purixiabackend.kodevio.com. Open
#     /api/catalog/products directly in the browser to see all products.
#   - The frontend (storefront) at purixia.kodevio.com calls the backend
#     DIRECTLY at https://purixiabackend.kodevio.com (no reverse proxy).
#     Django CORS allows cross-origin requests from the frontend domain.
#
# Before deploying:
#   1. Make sure a DNS record resolves to your server for each domain:
#        purixia.kodevio.com     -> server IP
#        purixiabackend.kodevio.com -> server IP
#      (If *.kodevio.com is already a wildcard pointing at the server, no DNS
#       change is needed - the compose labels below handle routing + the cert.)
#   2. Ensure this project directory is pushed to your git repo.
#   3. Deploy this file as a "Docker Compose" service in Dokploy.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: purixia_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DJANGO_SETTINGS_MODULE: core.settings.prod
      # Persist the SQLite DB on a named volume so orders/users survive redeploys
      SQLITE_DB_PATH: /app/sqlite/db.sqlite3
    volumes:
      - sqlite_data:/app/sqlite
    networks:
      - backend-net
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.http.routers.purixia-backend.rule=Host(`purixiabackend.kodevio.com`)
      - traefik.http.routers.purixia-backend.entrypoints=websecure
      - traefik.http.routers.purixia-backend.tls.certResolver=letsencrypt
      - traefik.docker.network=dokploy-network
      - traefik.http.services.purixia-backend.loadbalancer.server.port=8000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://purixiabackend.kodevio.com
    container_name: purixia_frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - backend-net
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.http.routers.purixia-frontend.rule=Host(`purixia.kodevio.com`)
      - traefik.http.routers.purixia-frontend.entrypoints=websecure
      - traefik.http.routers.purixia-frontend.tls.certResolver=letsencrypt
      - traefik.docker.network=dokploy-network
      - traefik.http.services.purixia-frontend.loadbalancer.server.port=3000

volumes:
  sqlite_data:

networks:
  backend-net:
  dokploy-network:
    external: true